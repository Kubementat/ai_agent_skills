# Standard CI Pipeline Template
# Usage: Adapt for your project's language/framework

name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write if needed

env:
  CI: true
  NODE_ENV: production

jobs:
  # Job 1: Lint & Type Check
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: ✨ Run linter
        run: npm run lint
        
      - name: 🔢 Check formatting
        run: npm run format -- --check

  # Job 2: Unit Tests
  test:
    name: 🧪 Test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: 🧪 Run unit tests
        run: npm test -- --coverage
        
      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Job 3: Build
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: 🔨 Build project
        run: npm run build
        
      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 7

  # Job 4: Integration Tests (optional)
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
          
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: 🚀 Start application
        run: npm run start &
        
      - name: 🔗 Run integration tests
        run: npm run test:integration

  # Job 5: Security Scan (optional)
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        
      - name: 🛡️ Run security audit
        run: npm audit --audit-level=moderate
        
      - name: 🔍 Check for vulnerabilities with Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

# Summary annotations
# 
# This template demonstrates:
# 1. Parallel job execution (lint, test run simultaneously)
# 2. Matrix strategy for multi-version testing  
# 3. Dependency caching for faster builds
# 4. Artifact management for build outputs
# 5. Conditional job execution via needs/requirements
# 6. Timeout protection on all jobs
#
# Customization notes:
# - Replace Node.js commands with your language/framework equivalents
# - Adjust matrix versions based on supported runtimes
# - Add/remove jobs based on project needs
# - Configure secrets for external services (Codecov, Snyk, etc.)